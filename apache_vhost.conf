# ====================================================================
# Apache 2.4 VirtualHost Configuration for Coding Practice Hub
# ====================================================================
# Requires mod_wsgi module:
# LoadModule wsgi_module modules/mod_wsgi.so (or full path to mod_wsgi.so)
#
# Include this file in httpd.conf:
# Include "C:/Users/PC/Hemanth/Learning/Practice/apache_vhost.conf"
# ====================================================================

<VirtualHost *:80>
    ServerName coding-practice-hub
    ServerAlias www.coding-practice-hub coding-practice-hub.local
    DocumentRoot "C:/Users/PC/Hemanth/Learning/Practice"

    # Direct static files serving for high performance
    Alias /static "C:/Users/PC/Hemanth/Learning/Practice/static"
    <Directory "C:/Users/PC/Hemanth/Learning/Practice/static">
        Require all granted
    </Directory>

    # Mount WSGI Application at Root '/'
    WSGIScriptAlias / "C:/Users/PC/Hemanth/Learning/Practice/wsgi.py"

    <Directory "C:/Users/PC/Hemanth/Learning/Practice">
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Logging
    ErrorLog "C:/Users/PC/Hemanth/Learning/Practice/logs/apache_error.log"
    CustomLog "C:/Users/PC/Hemanth/Learning/Practice/logs/apache_access.log" combined
</VirtualHost>
