<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coding Practice Hub{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Early theme initialization to avoid flash of wrong theme -->
    <script>
        (function() {
            try {
                const pref = localStorage.getItem('ch_theme_preference') || 'dark';
                let effectiveTheme = pref;
                if (pref === 'system') {
                    effectiveTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', effectiveTheme);
                document.documentElement.setAttribute('data-theme-preference', pref);
                
                const isCollapsed = localStorage.getItem('ch_sidebar_collapsed') === 'true';
                if (isCollapsed) {
                    document.documentElement.classList.add('sidebar-is-collapsed');
                }
            } catch (e) {}
        })();
    </script>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <!-- Mermaid for System Design -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script>
        if (window.mermaid) {
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        }
    </script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <!-- Vertical Left Sidebar Navigation -->
        <aside class="app-sidebar" id="app-sidebar">
            <div class="sidebar-top">
                <!-- Brand & Logo -->
                <div class="sidebar-brand-wrapper">
                    <a href="{{ url_for('dashboard.index') }}" class="sidebar-brand">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="sidebar-logo">
                        <div class="brand-text">
                            <span class="brand-title">Coding Practice</span>
                            <span class="brand-sub">Daily Hub</span>
                        </div>
                    </a>
                    <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle Sidebar" onclick="toggleSidebar()">
                        ◀
                    </button>
                </div>

                <!-- Global Quick Search button -->
                <div class="sidebar-search-box">
                    <button class="sidebar-search-btn" onclick="openSearchModal()" title="Search practices (Ctrl+K)">
                        <span class="search-icon">🔍</span>
                        <span class="search-label">Quick Search</span>
                        <span class="kbd-badge">Ctrl K</span>
                    </button>
                </div>

                <!-- Main Navigation Links -->
                <nav class="sidebar-nav">
                    <div class="nav-section-label">PRACTICE & TRACKING</div>
                    <ul class="sidebar-menu">
                        <li>
                            <a href="{{ url_for('dashboard.index') }}" class="sidebar-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}" title="Dashboard (Daily Overview & Streaks)">
                                <span class="sidebar-icon">🏠</span>
                                <span class="sidebar-label">Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('practice.practice_workspace') }}" class="sidebar-link {% if request.endpoint == 'practice.practice_workspace' %}active{% endif %}" title="Practice Workspace (Editor & Runner)">
                                <span class="sidebar-icon">💻</span>
                                <span class="sidebar-label">Practice Workspace</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('history.history_view') }}" class="sidebar-link {% if request.endpoint == 'history.history_view' or request.endpoint == 'history.tech_view' %}active{% endif %}" title="Practice History & Archives">
                                <span class="sidebar-icon">📜</span>
                                <span class="sidebar-label">Practice History</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('datasets.datasets_view') }}" class="sidebar-link {% if request.endpoint == 'datasets.datasets_view' %}active{% endif %}" title="Datasets Manager">
                                <span class="sidebar-icon">📊</span>
                                <span class="sidebar-label">Datasets</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('reports.reports_view') }}" class="sidebar-link {% if request.endpoint == 'reports.reports_view' %}active{% endif %}" title="Reports & Analytics">
                                <span class="sidebar-icon">📈</span>
                                <span class="sidebar-label">Reports</span>
                            </a>
                        </li>
                        <li>
                            <a href="{{ url_for('settings.settings_view') }}" class="sidebar-link {% if request.endpoint == 'settings.settings_view' %}active{% endif %}" title="Settings & Diagnostics">
                                <span class="sidebar-icon">⚙️</span>
                                <span class="sidebar-label">Settings</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Sidebar Bottom: Theming Options & System Controls -->
            <div class="sidebar-bottom">
                <div class="theme-control-box">
                    <div class="theme-control-header">
                        <span class="theme-icon-indicator" id="theme-active-icon">🌓</span>
                        <span class="theme-label">Theming</span>
                    </div>
                    <div class="theme-picker-group">
                        <button class="theme-pick-btn" data-theme-value="system" onclick="setAppTheme('system')" title="System Default (Follow OS)">
                            <span class="theme-btn-icon">🖥️</span>
                            <span class="theme-btn-text">System</span>
                        </button>
                        <button class="theme-pick-btn" data-theme-value="light" onclick="setAppTheme('light')" title="Light Theme">
                            <span class="theme-btn-icon">☀️</span>
                            <span class="theme-btn-text">Light</span>
                        </button>
                        <button class="theme-pick-btn" data-theme-value="dark" onclick="setAppTheme('dark')" title="Dark Theme (Deep Slate)">
                            <span class="theme-btn-icon">🌙</span>
                            <span class="theme-btn-text">Dark</span>
                        </button>
                        <button class="theme-pick-btn" data-theme-value="grey" onclick="setAppTheme('grey')" title="Grey Theme (Modern Zinc / Charcoal)">
                            <span class="theme-btn-icon">🩶</span>
                            <span class="theme-btn-text">Grey</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-footer-info">
                    <span class="footer-app-name">Coding Practice Hub</span>
                    <span class="footer-port-badge">Port 5000</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Viewport -->
        <div class="app-main-viewport">
            <main class="{% block main_class %}main-content{% endblock %}">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Global Search Modal -->
    <div id="search-modal" class="modal-overlay" onclick="if(event.target === this) closeSearchModal()">
        <div class="modal-content" style="max-width: 650px;">
            <div class="modal-header">
                <h3>Global Practice Search</h3>
                <button class="modal-close-btn" onclick="closeSearchModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="global-search-input" class="search-input-box" placeholder="Search by title, question, topic, tag, code, notes..." autocomplete="off">
                <div id="search-results-list" class="search-results-list"></div>
            </div>
        </div>
    </div>

    <!-- Core App JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
