{% extends "base.html" %}

{% block title %}Documentation & Prep Hub - Coding Practice Hub{% endblock %}

{% block head_extra %}
<!-- Markdown Parser for migrating legacy notes to rich Word document format -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
{% endblock %}

{% block content %}
<!-- Documentation Workspace -->
<div class="confluence-workspace">
    <!-- Left Navigation Tree Sidebar -->
    <aside class="confluence-sidebar" id="notes-tree-sidebar">
        <div class="confluence-sidebar-header">
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <span style="font-size:1.25rem;">📚</span>
                <span style="font-weight:700; font-size:1rem; color:var(--text-primary);">Documentation</span>
            </div>
            <button class="btn btn-primary btn-sm" onclick="createNewNote(activeCategory !== 'all' ? activeCategory : 'Key Notes')" title="Create New Document in current topic">
                + New Doc
            </button>
        </div>

        <!-- Horizontal Topic Filter Tabs inside Sidebar -->
        <div class="doc-topic-tabs-bar sidebar-topic-tabs" id="doc-topic-tabs-bar">
            <button type="button" class="topic-tab active" onclick="selectTopicCategory('all')" data-cat="all">
                🌟 All
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('Key Notes')" data-cat="Key Notes">
                📝 Key Notes
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('SQL')" data-cat="SQL">
                🗄️ SQL
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('Python')" data-cat="Python">
                🐍 Python
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('PySpark')" data-cat="PySpark">
                ⚡ PySpark
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('Databricks')" data-cat="Databricks">
                🧱 Databricks
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('Cloud')" data-cat="Cloud">
                ☁️ Cloud
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('DSA')" data-cat="DSA">
                🧩 DSA
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('System Design')" data-cat="System Design">
                📐 System Design
            </button>
            <button type="button" class="topic-tab" onclick="selectTopicCategory('HR & Behavioral')" data-cat="HR & Behavioral">
                🤝 HR & Behavioral
            </button>
        </div>

        <!-- Quick Search -->
        <div class="confluence-sidebar-search">
            <input type="text" id="notes-search-input" class="meta-input" placeholder="🔍 Search documents, tags, content..." oninput="filterNotesTree(this.value)">
        </div>

        <!-- Tree List of Notes -->
        <div class="confluence-tree-container" id="notes-tree-list">
            <div style="text-align:center; padding:1.5rem; color:var(--text-muted); font-size:0.85rem;">
                Loading documents...
            </div>
        </div>
    </aside>

    <!-- Main Document Area (Clean editor without top filter line) -->
    <main class="confluence-doc-pane" id="notes-doc-pane">

        <!-- Document Header / Metadata -->
        <div class="confluence-doc-header">
            <div class="confluence-header-top">
                <input type="text" id="note-title-input" class="confluence-title-input" placeholder="Untitled Document..." oninput="markNoteDirty()">
                <div class="confluence-header-actions">
                    <button type="button" id="btn-pin-note" class="btn btn-secondary btn-sm" onclick="togglePinCurrentNote()" title="Pin this document to top">
                        📌 <span id="pin-text">Pin</span>
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="copyDocumentText()" title="Copy document content to clipboard">
                        📋 Copy
                    </button>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteCurrentNote()" title="Delete this document">
                        🗑️ Delete
                    </button>
                    <button type="button" id="btn-save-note" class="btn btn-primary btn-sm" onclick="saveCurrentNote(true)" title="Save document changes (Ctrl+S)">
                        💾 Save
                    </button>
                </div>
            </div>

            <!-- Metadata Fields (Category, Date, Tech, Tags) -->
            <div class="confluence-meta-bar">
                <div class="confluence-meta-pill">
                    <label>Category:</label>
                    <select id="note-category-select" class="meta-select-compact" onchange="handleCategorySelectChange()">
                        {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="confluence-meta-pill">
                    <label>Date:</label>
                    <input type="date" id="note-date-input" class="meta-input-compact" onchange="markNoteDirty()">
                </div>

                <div class="confluence-meta-pill">
                    <label>Tech:</label>
                    <select id="note-tech-select" class="meta-select-compact" onchange="markNoteDirty()">
                        <option value="">None / General</option>
                        {% for tech in technologies %}
                            <option value="{{ tech }}">{{ tech }}</option>
                        {% endfor %}
                        <option value="AWS">AWS</option>
                        <option value="Azure">Azure</option>
                        <option value="Cloud">Cloud</option>
                        <option value="HR">HR / Behavioral</option>
                    </select>
                </div>

                <div class="confluence-meta-pill" style="flex:1; min-width:180px;">
                    <label>Tags:</label>
                    <input type="text" id="note-tags-input" class="meta-input-compact" style="width:100%;" placeholder="e.g. sql, indexing, interview, notes" oninput="markNoteDirty()">
                </div>

                <div id="note-autosave-indicator" class="autosave-status" style="margin-left:auto;">
                    <span>All changes saved</span>
                </div>
            </div>
        </div>

        <!-- Word Document Formatting Toolbar -->
        <div class="word-toolbar" id="word-toolbar">
            <!-- Edit / Read-Only View Mode Toggle -->
            <div class="toolbar-group">
                <button type="button" class="word-btn active" id="btn-mode-edit" onclick="setDocMode('edit')" title="Edit Document Directly">
                    ✏️ Edit
                </button>
                <button type="button" class="word-btn" id="btn-mode-view" onclick="setDocMode('view')" title="Read-Only Document View">
                    👁️ View
                </button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Headings -->
            <div class="toolbar-group">
                <button type="button" class="word-btn" onclick="formatHeading('h1')" title="Heading 1"><b>H1</b></button>
                <button type="button" class="word-btn" onclick="formatHeading('h2')" title="Heading 2"><b>H2</b></button>
                <button type="button" class="word-btn" onclick="formatHeading('h3')" title="Heading 3"><b>H3</b></button>
                <button type="button" class="word-btn" onclick="formatHeading('p')" title="Normal Paragraph">P</button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Font Styles: Bold, Italic, Underline, Strikethrough -->
            <div class="toolbar-group">
                <button type="button" class="word-btn" onclick="execCmd('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
                <button type="button" class="word-btn" onclick="execCmd('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
                <button type="button" class="word-btn" onclick="execCmd('underline')" title="Underline (Ctrl+U)"><u>U</u></button>
                <button type="button" class="word-btn" onclick="execCmd('strikeThrough')" title="Strikethrough"><s>S</s></button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Content Alignment: Left, Center, Right, Justify -->
            <div class="toolbar-group">
                <button type="button" class="word-btn" onclick="execCmd('justifyLeft')" title="Align Left">⇤ Left</button>
                <button type="button" class="word-btn" onclick="execCmd('justifyCenter')" title="Align Center">☰ Center</button>
                <button type="button" class="word-btn" onclick="execCmd('justifyRight')" title="Align Right">⇥ Right</button>
                <button type="button" class="word-btn" onclick="execCmd('justifyFull')" title="Justify">☷ Justify</button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Lists & Interactive Checkbox / Radio -->
            <div class="toolbar-group">
                <button type="button" class="word-btn" onclick="execCmd('insertUnorderedList')" title="Bulleted List">• List</button>
                <button type="button" class="word-btn" onclick="execCmd('insertOrderedList')" title="Numbered List">1. Number</button>
                <button type="button" class="word-btn" onclick="insertCheckbox()" title="Insert Interactive Checkbox">☑ Checkbox</button>
                <button type="button" class="word-btn" onclick="insertRadio()" title="Insert Interactive Radio Option">🔘 Radio</button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Code & Tables -->
            <div class="toolbar-group">
                <button type="button" class="word-btn" onclick="insertInlineCode()" title="Inline Code">`code`</button>
                <button type="button" class="word-btn" onclick="insertCodeBlock()" title="Code Block">```</button>
                <button type="button" class="word-btn" onclick="insertTable()" title="Insert Table">📊 Table</button>
                <button type="button" class="word-btn" onclick="insertHorizontalRule()" title="Horizontal Line">── Line</button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Callout Alert Boxes: Note, Tip, Warning, Important -->
            <div class="toolbar-group">
                <button type="button" class="word-btn callout-btn-note" onclick="insertCallout('NOTE')" title="Info Note Callout">ℹ️ Note</button>
                <button type="button" class="word-btn callout-btn-tip" onclick="insertCallout('TIP')" title="Tip Callout">💡 Tip</button>
                <button type="button" class="word-btn callout-btn-warning" onclick="insertCallout('WARNING')" title="Warning Callout">⚠️ Warning</button>
                <button type="button" class="word-btn callout-btn-important" onclick="insertCallout('IMPORTANT')" title="Important Callout">⚡ Important</button>
            </div>

            <span class="toolbar-divider"></span>

            <!-- Undo / Redo / Clear -->
            <div class="toolbar-group">
                <button type="button" class="word-btn" onclick="execCmd('undo')" title="Undo (Ctrl+Z)">↺</button>
                <button type="button" class="word-btn" onclick="execCmd('redo')" title="Redo (Ctrl+Y)">↻</button>
                <button type="button" class="word-btn" onclick="execCmd('removeFormat')" title="Clear Formatting">🧹</button>
            </div>

            <!-- Toolbar Window Controls -->
            <div style="display:flex; align-items:center; gap:0.35rem; margin-left:auto;">
                <button type="button" id="toolbar-btn-maximize-doc" class="pane-icon-btn" onclick="toggleMaximizeDoc()" title="Maximize / Restore (Esc)">🗖</button>
                <button type="button" id="toolbar-btn-fullscreen-doc" class="pane-icon-btn" onclick="toggleFullScreenDoc()" title="Toggle Fullscreen (F11)">⛶</button>
            </div>
        </div>

        <!-- Word Document Paper Canvas -->
        <div class="word-canvas-wrapper" id="word-canvas-wrapper" onclick="focusDocumentSheet(event)">
            <div class="word-document-sheet" id="word-document-sheet" contenteditable="true" spellcheck="true" oninput="handleWordDocInput()">
                <!-- Editable Word Document Body -->
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script>
    // State
    let allNotes = {{ notes|tojson }};
    let currentNoteId = {{ active_note.id if active_note else 'null' }};
    let activeCategory = 'all'; // 'all' or category string
    let isNoteDirty = false;
    let noteAutosaveTimer = null;
    let isReadOnlyMode = false;

    document.addEventListener('DOMContentLoaded', () => {
        // Restore saved topic category
        try {
            const savedCat = localStorage.getItem('cph_last_note_category');
            if (savedCat && (savedCat === 'all' || {{ categories|tojson }}.includes(savedCat))) {
                activeCategory = savedCat;
                document.querySelectorAll('.topic-tab').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-cat') === savedCat);
                });
            }
        } catch (e) {}

        renderNotesTree();

        // Priority for opening note: 1) URL query param 'id', 2) currentNoteId from server/cookie, 3) localStorage
        let targetId = currentNoteId;
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('id') ? parseInt(urlParams.get('id'), 10) : null;
            const savedId = localStorage.getItem('cph_last_note_id') ? parseInt(localStorage.getItem('cph_last_note_id'), 10) : null;
            if (urlId && allNotes.some(n => n.id === urlId)) {
                targetId = urlId;
            } else if (savedId && allNotes.some(n => n.id === savedId)) {
                targetId = savedId;
            }
        } catch (e) {}

        if (targetId && allNotes.some(n => n.id === targetId)) {
            loadNoteById(targetId);
        } else if (currentNoteId && allNotes.some(n => n.id === currentNoteId)) {
            loadNoteById(currentNoteId);
        } else if (allNotes.length > 0) {
            loadNoteById(allNotes[0].id);
        } else {
            createNewNote('Key Notes', 'Key Notes & Learnings');
        }

        // Global Keyboard Shortcut: Ctrl+S to save, Esc to restore maximize
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                if (document.getElementById('notes-doc-pane')) {
                    e.preventDefault();
                    saveCurrentNote(true);
                }
            } else if (e.key === 'Escape') {
                const workspace = document.querySelector('.confluence-workspace');
                if (workspace && workspace.classList.contains('doc-maximized')) {
                    toggleMaximizeDoc();
                }
            }
        });

        // Enable horizontal scrolling with mouse wheel on sidebar topic tabs
        const topicTabsBar = document.getElementById('doc-topic-tabs-bar');
        if (topicTabsBar) {
            topicTabsBar.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    topicTabsBar.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        }
    });

    // Topic Category Switcher
    async function selectTopicCategory(cat) {
        activeCategory = cat;
        try {
            localStorage.setItem('cph_last_note_category', cat);
            document.cookie = `cph_last_note_category=${encodeURIComponent(cat)}; path=/; max-age=2592000; SameSite=Lax`;
        } catch (e) {}
        // Update tabs active state
        document.querySelectorAll('.topic-tab').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-cat') === cat);
        });

        renderNotesTree(document.getElementById('notes-search-input')?.value || '');

        if (cat !== 'all') {
            const matches = allNotes.filter(n => n.category === cat);
            if (matches.length > 0) {
                const currentMatches = matches.some(n => n.id === currentNoteId);
                if (!currentMatches) {
                    selectNote(matches[0].id);
                }
            } else {
                const confirmed = await showAppConfirm({
                    title: 'Create Document',
                    message: `No documents found in "${cat}". Would you like to create one now?`,
                    confirmText: 'Create Document',
                    isDanger: false,
                    icon: '📝'
                });
                if (confirmed) {
                    createNewNote(cat, `${cat} - Document`);
                }
            }
        }
    }

    function filterNotesTree(q) {
        renderNotesTree(q);
    }

    // Render tree in left navigation
    function renderNotesTree(filterQuery = '') {
        const container = document.getElementById('notes-tree-list');
        if (!container) return;

        let filtered = allNotes;

        // Apply topic tab filter
        if (activeCategory && activeCategory !== 'all') {
            filtered = filtered.filter(n => n.category === activeCategory);
        }

        // Apply search query filter
        if (filterQuery && filterQuery.trim()) {
            const q = filterQuery.toLowerCase();
            filtered = filtered.filter(n =>
                (n.title && n.title.toLowerCase().includes(q)) ||
                (n.tags && n.tags.toLowerCase().includes(q)) ||
                (n.category && n.category.toLowerCase().includes(q)) ||
                (n.content && n.content.toLowerCase().includes(q))
            );
        }

        if (filtered.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding:1.5rem; color:var(--text-muted); font-size:0.85rem;">
                    No documents found.
                    <div style="margin-top:0.6rem;">
                        <button class="btn btn-primary btn-sm" onclick="createNewNote(activeCategory !== 'all' ? activeCategory : 'Key Notes')">
                            + Create Document
                        </button>
                    </div>
                </div>
            `;
            return;
        }

        const pinned = filtered.filter(n => n.is_pinned);
        const unpinned = filtered.filter(n => !n.is_pinned);

        let html = '';

        if (pinned.length > 0) {
            html += `<div class="tree-section-header">📌 Pinned (${pinned.length})</div>`;
            html += pinned.map(renderTreeItem).join('');
        }

        const sectionTitle = activeCategory === 'all' ? 'All Documents' : activeCategory;
        html += `<div class="tree-section-header">📁 ${sectionTitle} (${unpinned.length})</div>`;
        html += unpinned.map(renderTreeItem).join('');

        container.innerHTML = html;
    }

    function renderTreeItem(note) {
        const isActive = note.id === currentNoteId;
        const iconMap = {
            'Key Notes': '📝',
            'SQL': '🗄️',
            'Python': '🐍',
            'PySpark': '⚡',
            'Databricks': '🧱',
            'Cloud': '☁️',
            'DSA': '🧩',
            'System Design': '📐',
            'HR & Behavioral': '🤝',
            'General': '📄'
        };
        const icon = iconMap[note.category] || '📄';

        return `
            <div class="tree-item ${isActive ? 'active' : ''}" data-note-id="${note.id}">
                <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:0.4rem; width:100%;">
                    <div style="display:flex; align-items:center; gap:0.45rem; flex:1; min-width:0; cursor:pointer;" onclick="selectNote(${note.id})">
                        <span style="font-size:1rem; flex-shrink:0;">${icon}</span>
                        <div style="min-width:0; overflow:hidden;">
                            <div class="tree-item-title" title="${escapeHtml(note.title || 'Untitled')}">${escapeHtml(note.title || 'Untitled')}</div>
                            <div class="tree-item-meta">
                                <span>${note.category || 'Note'}</span>
                                <span>•</span>
                                <span>${note.date_str || ''}</span>
                            </div>
                        </div>
                    </div>
                    <div class="tree-item-actions">
                        <button type="button" class="tree-mini-action" onclick="openNoteInViewMode(${note.id}, event)" title="View (Read-Only)">👁️</button>
                        <button type="button" class="tree-mini-action" onclick="openNoteInEditMode(${note.id}, event)" title="Edit">✏️</button>
                        <button type="button" class="tree-mini-action danger" onclick="deleteNoteDirect(${note.id}, event)" title="Delete">🗑️</button>
                    </div>
                </div>
            </div>
        `;
    }

    async function selectNote(noteId) {
        if (isNoteDirty && currentNoteId && currentNoteId !== noteId) {
            await saveCurrentNote(false);
        }
        loadNoteById(noteId);
    }

    function openNoteInViewMode(noteId, event) {
        if (event) event.stopPropagation();
        selectNote(noteId);
        setDocMode('view');
    }

    function openNoteInEditMode(noteId, event) {
        if (event) event.stopPropagation();
        selectNote(noteId);
        setDocMode('edit');
    }

    function deleteNoteDirect(noteId, event) {
        if (event) event.stopPropagation();
        currentNoteId = noteId;
        deleteCurrentNote();
    }

    function loadNoteById(noteId) {
        const note = allNotes.find(n => n.id === noteId);
        if (!note) return;

        currentNoteId = note.id;
        document.getElementById('note-title-input').value = note.title || '';
        document.getElementById('note-category-select').value = note.category || 'Key Notes';
        document.getElementById('note-date-input').value = note.date_str || new Date().toISOString().slice(0, 10);
        document.getElementById('note-tech-select').value = note.technology || '';
        document.getElementById('note-tags-input').value = note.tags || '';

        // Load Content into Word Document Sheet
        const sheet = document.getElementById('word-document-sheet');
        renderNoteContentToSheet(sheet, note.content || '');

        updatePinBtnUI(Boolean(note.is_pinned));
        renderNotesTree(document.getElementById('notes-search-input')?.value || '');

        isNoteDirty = false;
        updateAutosaveIndicator('All changes saved');

        try {
            localStorage.setItem('cph_last_note_id', String(note.id));
            document.cookie = `cph_last_note_id=${note.id}; path=/; max-age=2592000; SameSite=Lax`;
            const url = new URL(window.location);
            url.searchParams.set('id', note.id);
            window.history.replaceState({ noteId: note.id }, '', url);
        } catch (e) {}
    }

    function updatePinBtnUI(isPinned) {
        const btn = document.getElementById('btn-pin-note');
        const text = document.getElementById('pin-text');
        if (isPinned) {
            btn.className = 'btn btn-primary btn-sm';
            text.textContent = 'Pinned';
        } else {
            btn.className = 'btn btn-secondary btn-sm';
            text.textContent = 'Pin';
        }
    }

    function togglePinCurrentNote() {
        const note = allNotes.find(n => n.id === currentNoteId);
        const newPinned = note ? (note.is_pinned ? 0 : 1) : 1;
        if (note) note.is_pinned = newPinned;
        updatePinBtnUI(Boolean(newPinned));
        markNoteDirty();
        saveCurrentNote(false);
    }

    function handleCategorySelectChange() {
        markNoteDirty();
        const selectedCat = document.getElementById('note-category-select').value;
        if (activeCategory !== 'all' && activeCategory !== selectedCat) {
            selectTopicCategory(selectedCat);
        }
    }

    function createNewNote(category = 'Key Notes', initialTitle = '') {
        currentNoteId = null;
        const todayStr = new Date().toISOString().slice(0, 10);
        const defaultTitle = initialTitle || `New ${category} Document`;

        document.getElementById('note-title-input').value = defaultTitle;
        document.getElementById('note-category-select').value = category;
        document.getElementById('note-date-input').value = todayStr;
        document.getElementById('note-tech-select').value = category === 'Key Notes' ? '' : category;
        document.getElementById('note-tags-input').value = '';

        const sheet = document.getElementById('word-document-sheet');
        if (sheet) {
            sheet.innerHTML = `
                <h1>${escapeHtml(defaultTitle)}</h1>
                <p>Start writing your notes, key takeaways, code, or interview preparation here...</p>
                <div class="doc-callout callout-tip" contenteditable="false">
                    <div class="callout-header">💡 TIP</div>
                    <div class="callout-body" contenteditable="true">Use the toolbar buttons above to align text, add checklists, radio buttons, tables, and callouts.</div>
                </div>
                <p><br></p>
            `;
        }

        updatePinBtnUI(false);
        setDocMode('edit');
        isNoteDirty = true;
        saveCurrentNote(false);
    }

    function markNoteDirty() {
        isNoteDirty = true;
        updateAutosaveIndicator('● Unsaved changes');
        scheduleNoteAutosave();
    }

    function handleWordDocInput() {
        markNoteDirty();
    }

    function scheduleNoteAutosave() {
        clearTimeout(noteAutosaveTimer);
        noteAutosaveTimer = setTimeout(() => {
            saveCurrentNote(false);
        }, 2500); // 2.5-second debounce
    }

    async function saveCurrentNote(isManual = false) {
        const title = document.getElementById('note-title-input').value.trim() || 'Untitled Document';
        const category = document.getElementById('note-category-select').value;
        const date_str = document.getElementById('note-date-input').value;
        const technology = document.getElementById('note-tech-select').value;
        const tags = document.getElementById('note-tags-input').value;
        const sheet = document.getElementById('word-document-sheet');
        const content = sheet ? sheet.innerHTML : '';
        const noteObj = allNotes.find(n => n.id === currentNoteId);
        const is_pinned = noteObj ? (noteObj.is_pinned ? 1 : 0) : 0;

        updateAutosaveIndicator('Saving...');

        const payload = {
            id: currentNoteId,
            title,
            category,
            date_str,
            technology,
            tags,
            content,
            is_pinned
        };

        try {
            const res = await fetch('/api/notes/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success && data.note) {
                const saved = data.note;
                const idx = allNotes.findIndex(n => n.id === saved.id);
                if (idx !== -1) {
                    allNotes[idx] = saved;
                } else {
                    allNotes.unshift(saved);
                }
                currentNoteId = saved.id;
                isNoteDirty = false;
                updateAutosaveIndicator(`All changes saved (${new Date().toLocaleTimeString()})`);
                renderNotesTree(document.getElementById('notes-search-input')?.value || '');
                if (isManual) {
                    showToast('Document saved successfully!', 'success');
                }
            } else {
                updateAutosaveIndicator('Save failed');
            }
        } catch (err) {
            updateAutosaveIndicator('Save error');
            console.error('Document save error:', err);
        }
    }

    async function deleteCurrentNote() {
        if (!currentNoteId) return;
        const note = allNotes.find(n => n.id === currentNoteId);
        const title = note ? note.title : 'this document';

        const confirmed = await showAppConfirm({
            title: 'Delete Document',
            message: `Are you sure you want to delete "${title}"? This cannot be undone.`,
            confirmText: 'Delete Document',
            isDanger: true,
            icon: '🗑️'
        });
        if (!confirmed) return;

        try {
            const res = await fetch('/api/notes/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: currentNoteId })
            });
            const data = await res.json();
            if (data.success) {
                showToast('Document deleted successfully', 'success');
                allNotes = allNotes.filter(n => n.id !== currentNoteId);
                renderNotesTree();
                if (allNotes.length > 0) {
                    loadNoteById(allNotes[0].id);
                } else {
                    try {
                        localStorage.removeItem('cph_last_note_id');
                        document.cookie = 'cph_last_note_id=; path=/; max-age=0; SameSite=Lax';
                    } catch (e) {}
                    createNewNote();
                }
            } else {
                showToast(data.error || 'Failed to delete document', 'error');
            }
        } catch (err) {
            showToast('Delete error: ' + err.message, 'error');
        }
    }

    function updateAutosaveIndicator(text) {
        const el = document.getElementById('note-autosave-indicator');
        if (el) el.textContent = text;
    }

    function transformCalloutsInHtml(html) {
        if (!html) return '';
        return html
            .replace(/<blockquote>\s*<p>\[!NOTE\]<br>([\s\S]*?)<\/p>\s*<\/blockquote>/gi,
                '<div class="doc-callout callout-note" contenteditable="false"><div class="callout-header">ℹ️ NOTE</div><div class="callout-body" contenteditable="true"><p>$1</p></div></div>')
            .replace(/<blockquote>\s*<p>\[!TIP\]<br>([\s\S]*?)<\/p>\s*<\/blockquote>/gi,
                '<div class="doc-callout callout-tip" contenteditable="false"><div class="callout-header">💡 TIP</div><div class="callout-body" contenteditable="true"><p>$1</p></div></div>')
            .replace(/<blockquote>\s*<p>\[!WARNING\]<br>([\s\S]*?)<\/p>\s*<\/blockquote>/gi,
                '<div class="doc-callout callout-warning" contenteditable="false"><div class="callout-header">⚠️ WARNING</div><div class="callout-body" contenteditable="true"><p>$1</p></div></div>')
            .replace(/<blockquote>\s*<p>\[!IMPORTANT\]<br>([\s\S]*?)<\/p>\s*<\/blockquote>/gi,
                '<div class="doc-callout callout-important" contenteditable="false"><div class="callout-header">⚡ IMPORTANT</div><div class="callout-body" contenteditable="true"><p>$1</p></div></div>');
    }

    function renderNoteContentToSheet(sheet, rawContent) {
        if (!sheet) return;
        if (!rawContent || !rawContent.trim()) {
            sheet.innerHTML = '<p><br></p>';
            return;
        }

        let content = rawContent.trim();

        // Check if content has markdown indicators (headings, tables, code fences, blockquotes, list markers)
        const hasMarkdownIndicators = content.startsWith('#') ||
                                      content.startsWith('>') ||
                                      content.startsWith('```') ||
                                      content.includes('\n#') ||
                                      content.includes('\n```') ||
                                      content.includes('\n|') ||
                                      content.startsWith('|') ||
                                      content.startsWith('<p>#') ||
                                      content.startsWith('<p>&gt;') ||
                                      content.startsWith('<p>|');

        const isPureHtml = (content.includes('<h1') || content.includes('<h2') || content.includes('<h3')) &&
                           !content.includes('\n|') && !content.includes('\n```') && !content.startsWith('<p>#');

        if (hasMarkdownIndicators && !isPureHtml && window.marked) {
            let cleanMd = content;
            if (cleanMd.startsWith('<p>') || cleanMd.includes('<br>')) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = cleanMd;
                cleanMd = tempDiv.innerText || tempDiv.textContent || cleanMd;
            }
            try {
                let parsedHtml = marked.parse(cleanMd);
                parsedHtml = transformCalloutsInHtml(parsedHtml);
                sheet.innerHTML = parsedHtml;
                return;
            } catch (e) {
                console.warn('Marked parsing error:', e);
            }
        }

        // Direct HTML rendering
        sheet.innerHTML = transformCalloutsInHtml(content);
    }

    // View / Edit Mode Switcher
    function setDocMode(mode) {
        const sheet = document.getElementById('word-document-sheet');
        const btnEdit = document.getElementById('btn-mode-edit');
        const btnView = document.getElementById('btn-mode-view');
        const toolbar = document.getElementById('word-toolbar');

        if (mode === 'view') {
            isReadOnlyMode = true;
            if (sheet) sheet.setAttribute('contenteditable', 'false');
            if (btnView) btnView.classList.add('active');
            if (btnEdit) btnEdit.classList.remove('active');
            showToast('Switched to View Mode (Read-Only)', 'info', 1500);
        } else {
            isReadOnlyMode = false;
            if (sheet) sheet.setAttribute('contenteditable', 'true');
            if (btnEdit) btnEdit.classList.add('active');
            if (btnView) btnView.classList.remove('active');
            showToast('Switched to Edit Mode', 'info', 1500);
        }
    }

    function focusDocumentSheet(e) {
        const sheet = document.getElementById('word-document-sheet');
        if (sheet && e.target === document.getElementById('word-canvas-wrapper')) {
            sheet.focus();
        }
    }

    // Word Document Exec Command Helpers
    function execCmd(command, value = null) {
        if (isReadOnlyMode) {
            showToast('Document is in View Mode. Click Edit to make changes.', 'info');
            return;
        }
        const sheet = document.getElementById('word-document-sheet');
        if (sheet) sheet.focus();
        document.execCommand(command, false, value);
        handleWordDocInput();
    }

    function formatHeading(tag) {
        if (isReadOnlyMode) return;
        const sheet = document.getElementById('word-document-sheet');
        if (sheet) sheet.focus();
        document.execCommand('formatBlock', false, `<${tag}>`);
        handleWordDocInput();
    }

    function insertHtmlAtCursor(html) {
        if (isReadOnlyMode) {
            showToast('Document is in View Mode. Click Edit to modify.', 'info');
            return;
        }
        const sheet = document.getElementById('word-document-sheet');
        if (sheet) sheet.focus();

        const sel = window.getSelection();
        if (sel.getRangeAt && sel.rangeCount) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            const el = document.createElement("div");
            el.innerHTML = html;
            const frag = document.createDocumentFragment();
            let node, lastNode;
            while ((node = el.firstChild)) {
                lastNode = frag.appendChild(node);
            }
            range.insertNode(frag);
            if (lastNode) {
                range.setStartAfter(lastNode);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        } else {
            if (sheet) sheet.innerHTML += html;
        }
        handleWordDocInput();
    }

    function insertCheckbox() {
        const html = `<div class="doc-checkbox-row"><input type="checkbox" class="doc-checkbox-input" onchange="markNoteDirty()"> <span class="doc-item-text" contenteditable="true">Task item...</span></div><p><br></p>`;
        insertHtmlAtCursor(html);
    }

    function insertRadio() {
        const radioGroup = 'radio_grp_' + Math.floor(Math.random() * 100000);
        const html = `<div class="doc-radio-row"><input type="radio" name="${radioGroup}" class="doc-radio-input" onchange="markNoteDirty()"> <span class="doc-item-text" contenteditable="true">Radio option...</span></div><p><br></p>`;
        insertHtmlAtCursor(html);
    }

    function insertInlineCode() {
        const selection = window.getSelection();
        const text = selection.toString() || 'code';
        const html = `<code class="doc-inline-code">${escapeHtml(text)}</code>&nbsp;`;
        insertHtmlAtCursor(html);
    }

    function insertCodeBlock() {
        const html = `<pre class="doc-code-block"><code contenteditable="true">-- Type or paste your code snippet here\nSELECT * FROM table;\n</code></pre><p><br></p>`;
        insertHtmlAtCursor(html);
    }

    function insertTable() {
        const html = `
            <table class="doc-table">
                <thead>
                    <tr>
                        <th>Header 1</th>
                        <th>Header 2</th>
                        <th>Header 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Data A1</td>
                        <td>Data A2</td>
                        <td>Active</td>
                    </tr>
                    <tr>
                        <td>Data B1</td>
                        <td>Data B2</td>
                        <td>Verified</td>
                    </tr>
                </tbody>
            </table>
            <p><br></p>
        `;
        insertHtmlAtCursor(html);
    }

    function insertHorizontalRule() {
        insertHtmlAtCursor('<hr class="doc-hr"><p><br></p>');
    }

    function insertCallout(type) {
        const titles = {
            'NOTE': 'ℹ️ NOTE',
            'TIP': '💡 TIP',
            'WARNING': '⚠️ WARNING',
            'IMPORTANT': '⚡ IMPORTANT'
        };
        const typeLower = type.toLowerCase();
        const html = `
            <div class="doc-callout callout-${typeLower}">
                <div class="callout-header">${titles[type] || 'ℹ️ NOTE'}</div>
                <div class="callout-body" contenteditable="true">Important information or key rule here...</div>
            </div>
            <p><br></p>
        `;
        insertHtmlAtCursor(html);
    }

    function copyDocumentText() {
        const sheet = document.getElementById('word-document-sheet');
        if (sheet) {
            const text = sheet.innerText || sheet.textContent || '';
            navigator.clipboard.writeText(text);
            showToast('Document text copied to clipboard!', 'info');
        }
    }

    // Window Controls: Maximize / Restore & Fullscreen
    function toggleMaximizeDoc() {
        const workspace = document.querySelector('.confluence-workspace');
        const maxBtn = document.getElementById('btn-maximize-doc');
        const toolbarBtn = document.getElementById('toolbar-btn-maximize-doc');
        if (!workspace) return;

        const isMax = workspace.classList.toggle('doc-maximized');
        if (isMax) {
            if (maxBtn) {
                maxBtn.classList.add('active');
                maxBtn.innerHTML = '<span id="maximize-doc-icon">🗗</span> <span id="maximize-doc-text">Restore</span>';
                maxBtn.title = 'Restore standard layout (Esc)';
            }
            if (toolbarBtn) {
                toolbarBtn.classList.add('active');
                toolbarBtn.textContent = '🗗';
                toolbarBtn.title = 'Restore standard layout (Esc)';
            }
            showToast('Maximized: Full-screen Document View (Press Esc to restore)', 'info', 2200);
        } else {
            if (maxBtn) {
                maxBtn.classList.remove('active');
                maxBtn.innerHTML = '<span id="maximize-doc-icon">🗖</span> <span id="maximize-doc-text">Maximize</span>';
                maxBtn.title = 'Maximize Document View / Restore (Esc)';
            }
            if (toolbarBtn) {
                toolbarBtn.classList.remove('active');
                toolbarBtn.textContent = '🗖';
                toolbarBtn.title = 'Maximize / Restore (Esc)';
            }
            showToast('Standard View Restored', 'info', 1500);
        }
    }

    function toggleFullScreenDoc() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
                showToast('Entered Fullscreen Mode (Press Esc or F11 to exit)', 'info', 2000);
            }).catch(err => {
                console.error('Fullscreen request failed:', err);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen().then(() => {
                    showToast('Exited Fullscreen Mode', 'info', 1500);
                });
            }
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
{% endblock %}
